#
# Настройка сообщений
#
#
# В большинстве случаев переменные внутри сообщений — это те, которые доступны
# для конкретного сообщения. Исключение - сообщения, связанные с наказаниями.
#
# Когда сообщение связано с наказанием, доступны следующие переменные:
#
# %ID% - номер наказания
# %TYPE% - тип наказания (например 'Ban')
# %TYPE_VERB% - тип наказания в виде глагола (например 'Banned')
# %VICTIM% - ник нарушителя
# %VICTIM_ID% - UUID нарушителя
# %OPERATOR% - ник администратора, выдавшего наказание
# %OPERATOR_ID% - UUID администратора
# %UNOPERATOR% - ник администратора, снявшего наказание (только при снятии)
# %UNOPERATOR_ID% - UUID администратора, снявшего наказание
# %REASON% - причина наказания
# %SCOPE% - область наказания
# %DURATION% - заданная длительность наказания
# %START_DATE% - дата выдачи наказания
# %TIME_PASSED% - время, прошедшее с момента выдачи
# %TIME_PASSED_SIMPLE% - упрощённое время с момента выдачи (например 2 месяца)
# %END_DATE% - дата окончания или formatting.permanent-display.absolute для перманентных
# %TIME_REMAINING% - оставшееся время или formatting.permanent-display.relative для перманентных
# %TIME_REMAINING_SIMPLE% - упрощённое оставшееся время
# %HAS_EXPIRED% - истекло ли время наказания (не проверяет, было ли оно отозвано)
# %TRACK% - трек эскалации наказания
# %TRACK_ID% - ID трека эскалации
# %TRACK_NAMESPACE% - пространство имён трека
#
# Переменные с ограниченной доступностью:
# %TARGET% - исходный аргумент команды (например в /ipban Player1 это Player1)
# %SILENCE% - переменная тихого режима (доступна только в уведомлениях)
# %PAGE% - текущая страница
# %NEXTPAGE% - следующая страница
# %LASTPAGE% - последняя страница
# %NEXTPAGE_KEY% - код для перехода на следующую страницу
# %LASTPAGE_KEY% - код для перехода на последнюю страницу
all:
  prefix:
    # Префикс, который будет использоваться
    value: '&6&lLibertyBans &8»&7 '
    # Если включено, ко всем сообщениям будет добавляться префикс
    enable: true
    # Сообщение, если игрок вводит /libertybans без права 'libertybans.commands'
  base-permission-message: '&cУ вас нет прав для использования этой команды.'
  usage: '&cНеизвестная подкоманда. Использование:'
  # Сообщения об ошибке, когда игрок/IP не найден
  not-found:
    player-or-address: '&c&o%TARGET%&7 никнейм/IP не найден.'
    uuid: '&c&o%TARGET%&7 - неправильный UUID.'
    player: '&c&o%TARGET%&7 не найден ни онлайн, ни оффлайн.'
    # Раздел актуален только если включена система scopes
scopes:
  no-permission-for-default: '&cВы не можете использовать эту команду без указания области (scope).'
  invalid: '&cУказана неверная область: &e%SCOPE_ARG%&c.'
  no-permission: '&cУ вас нет прав использовать область &e%SCOPE%&c.'
  # Настройка команды /accounthistory
account-history:
  # Команда /accounthistory delete <user> <timestamp>
  delete:
    permission: '&cУ вас нет прав удалять историю аккаунтов.'
    no-such-account: '&cУ %TARGET% нет истории в указанное время.'
    success: '&7История аккаунта &e%TARGET%&7 успешно удалена.'
    usage:
      - '&cИспользование: /accounthistory delete <игрок> <timestamp>.&f'
      - '&7Timestamp указывается в unix-секундах (обычно берётся из
        /accounthistory list)'
      # Команда /accounthistory list
  listing:
    # Разделитель между записями списка
    separator: ''
    permission: '&cУ вас нет прав просматривать записи аккаунтов.'
      # Сообщение, которое отображается перед списком аккаунтов. Оставьте пустую строку, чтобы отключить.
      # Доступные переменные:
      # %TARGET% - целевой пользователь
      # %PAGE% - текущий номер страницы
      # %NEXTPAGE% - следующая страница
      # %NEXTPAGE_KEY% - код для перехода на следующую страницу
      # %LASTPAGE% - последняя страница
      # %LASTPAGE_KEY% - код для перехода на последнюю страницу
    header: '&7Известные аккаунты игрока &c&o%TARGET%&7:'
    none-found: '&7Страница не существует.'
    # Количество аккаунтов на одной странице
    per-page: 10
      # Как должна отображаться одна запись аккаунта
      # Доступные переменные в дополнение к переменным заголовка:
      # %USERNAME% - имя пользователя, с которым заходил игрок
      # %ADDRESS% - IP-адрес, с которого заходил игрок
      # %DATE_RECORDED% - дата записи входа
      # %DATE_RECORDED_RAW% - сырой timestamp записи входа
    layout: '%USERNAME% &7(%ADDRESS%) %DATE_RECORDED%
      (%DATE_RECORDED_RAW%)||ttp:&7Нажмите, чтобы удалить
      запись||cmd:/accounthistory delete %TARGET% %DATE_RECORDED_RAW%'
    # Формат нижнего колонтитула. Отправляется после каждой страницы.
    # Доступные переменные — те же, что и для заголовка.
    footer: '&7<Следующая страница>||ttp:Нажмите, чтобы перейти на следующую
      страницу||cmd:/libertybans accounthistory %TARGET% %NEXTPAGE_KEY%'
    usage: '&cИспользование: /accounthistory list <никнейм|ip> [страница]'

  usage: '&cИспользование: /accounthistory <delete|list>'
  # Сообщения для проверки мультиаккаунтов и уведомлений о них
  #
  # Перед настройкой этого раздела рекомендуется ознакомиться с настройками
  # address-enforcement в основном config.yml и понять различия видов обнаружения мультиаккаунтов.
  # Существует обычное (normal) и строгое (strict) обнаружение.
alts:
  # Настройка команды /alts
  command:
    # Разделитель между записями списка
    separator: []
    permission: '&cУ вас нет прав смотреть мультиаккаунты.'
      # Сообщение, которое отображается в начале проверки мультиаккаунтов.
      # Оставьте пустую строку, чтобы отключить.
      # Доступные переменные:
      # %TARGET% - целевой пользователь
      # %PAGE% - текущий номер страницы
      # %NEXTPAGE% - следующая страница
      # %NEXTPAGE_KEY% - код для перехода на следующую страницу
      # %LASTPAGE% - последняя страница
      # %LASTPAGE_KEY% - код для перехода на последнюю страницу
    header:
      - '&7Отчёт по мультиаккаунтам &c&o%TARGET%&7.&f'
      - '&7Большая вероятность - тот же IP-адрес, что у забаненного игрока.&f'
      - '&7Малая вероятность - общий прошлый IP-адрес.'
    none-found: '&7Страница не существует.'
    # Количество мультиаккаунтов на одной странице
    per-page: 10
    # Сортировать от самых старых обнаружений
    oldest-first: true
    # Формат нижнего колонтитула. Отправляется после каждой страницы.
    # Доступные переменные — те же, что и для заголовка.
    footer: '&7<Следующая страница>||ttp:Нажмите, чтобы перейти на следующую
      страницу||cmd:/libertybans alts %TARGET% %NEXTPAGE_KEY%'
    usage: '&cИспользование: /alts &e<никнейм> [страница]&c.'

  auto-show:
    # После такого количества мультиаккаунтов их перестанут показывать.
    limit: 4
    # Разделитель между записями списка
    separator: ', '
    # Сообщение, которое отображается в начале проверки. Оставьте пустую строку, чтобы отключить.
    header:
      - '&c&o%TARGET%&7 возможно является мультиаккаунтом. Ниже перечислены
        связанные аккаунты.&f'
      - '&7Большая вероятность - тот же IP-адрес.&f'
      - 'Малая вероятность - общий прошлый IP-адрес.'
    # Сортировать от самых старых обнаружений
    oldest-first: true
    # Сообщение, которое выводится после проверки мультиаккаунтов.
    # Оставьте пустую строку, чтобы отключить. Доступна переменная %TARGET%.
    footer: []

  formatting:
    # Описание мультиаккаунта, обнаруженного строгим методом.
    strict: '&eБольшая вероятность'
    # Описание мультиаккаунта, обнаруженного обычным методом.
    normal: '&cМалая вероятность'
    # В отображении мультиаккаунтов никнейм может форматироваться в зависимости от того, забанен ли аккаунт.
    # Например, забаненные мультиаккаунты могут быть красными, а незабаненные — зелёными.
    # Переменные: %USERNAME%
    name-display:
      not-punished: '&o%USERNAME%'
      muted: '&e&o%USERNAME%'
      banned: '&c&o%USERNAME%'
      # Как должна отображаться одна запись обнаруженного мультиаккаунта
      # В дополнение к переменным header/footer доступны:
      # %DETECTION_KIND% - тип обнаружения (будет заменён на normal или strict).
      # %ADDRESS% - IP-адрес, по которому произошло обнаружение
      # %RELEVANT_USER% - никнейм связанного аккаунта (отформатированный согласно name-display)
      # %RELEVANT_USERID% - UUID связанного аккаунта
      # %DATE_RECORDED% - дата записи обнаружения
    layout: '%RELEVANT_USER% &7(%ADDRESS%) %DATE_RECORDED% - %DETECTION_KIND%'

# Используется для /banlist, /mutelist, /history, /warns, /blame
lists:
  history:
    perPage: 10
    noPages: 'У &c&o%TARGET%&7 нет наказаний.'
    maxPages: '&7Страница &e%PAGE%&7 не существует.'
    permission:
      command: '&7У вас нет прав просматривать историю.'

    layout:
      header:
        - '&7[&eID&7] &8/ &7Тип наказания&f'
        - '&7Администратор &8/ &7Причина &8/ &7Дата выдачи&f'
      body:
        - '&7[&e%ID%&7] / %TYPE%&f'
        - '&7%OPERATOR% &8/ &7%REASON% &8/ &7%START_DATE%&f'
      footer: '&7Страница &e%PAGE%&7.||ttp:Нажмите, чтобы перейти на следующую
        страницу||cmd:/libertybans history %TARGET% %NEXTPAGE_KEY%'

    usage: '&cИспользование: /history &e<никнейм> [страница]'

  ban-list:
    perPage: 10
    noPages: '&7Активных банов нет.'
    maxPages: '&7Страница &e%PAGE%&7 не существует.'
    permission:
      command: '&7У вас нет прав просматривать список банов.'

    layout:
      header:
        - '&7[&eID&7] &e&oНарушитель&f'
        - '&7Администратор &8/ &7Причина &8/ &7Оставшееся время&f'
      body:
        - '&7[&e%ID%&7] &e&o%VICTIM%&f'
        - '&7%OPERATOR% &8/ &7%REASON% &8/ &7%TIME_REMAINING%&f'
      footer: '&7Страница &e%PAGE%&7.||ttp:Нажмите, чтобы перейти на следующую
        страницу||cmd:/libertybans banlist %NEXTPAGE_KEY%'

    usage: '&cИспользование: /banlist &e[страница]'

  mute-list:
    perPage: 10
    noPages: '&7Активных мутов нет.'
    maxPages: '&7Страница &e%PAGE%&7 не существует.'
    permission:
      command: '&7У вас нет прав просматривать список мутов.'

    layout:
      header:
        - '&7[&eID&7] &e&oНарушитель&f'
        - '&7Администратор &8/ &7Причина &8/ &7Оставшееся время&f'
      body:
        - '&7[&e%ID%&7] &e&o%VICTIM%&f'
        - '&7%OPERATOR% &8/ &7%REASON% &8/ &7%TIME_REMAINING%&f'
      footer: '&7Страница &e%PAGE%&7.||ttp:Нажмите, чтобы перейти на следующую
        страницу||cmd:/libertybans banlist %NEXTPAGE_KEY%'

    usage: '&cИспользование: /mutelist &e[страница]'

  blame:
    perPage: 10
    noPages: '&c&o%TARGET%&7 не наказывал других игроков.'
    maxPages: '&7Страница &e%PAGE%&7 не существует.'
    permission:
      command: '&7У вас нет прав использовать команду blame.'

    layout:
      header:
        - '&7[&eID&7] &e&oНарушитель &8/ &7Тип наказания&f'
        - '&7Причина &8/ &7Дата выдачи&f'
      body:
        - '&7[&e%ID%&7] &e&o%VICTIM% &8 / &7%TYPE%&f'
        - '&7%REASON% &8/ &7%START_DATE%&f'
      footer: '&7Страница &e%PAGE%&7.||ttp:Нажмите, чтобы перейти на следующую
        страницу||cmd:/libertybans blame %TARGET% %NEXTPAGE_KEY%'

    usage: '&cИспользование: /blame &e<никнейм> [страница]'

  warns:
    perPage: 10
    noPages: '&c&o%TARGET%&7 не имеет предупреждений.'
    maxPages: '&7Страница &e%PAGE%&7 не существует.'
    permission:
      command: '&7У вас нет прав просматривать предупреждения.'

    layout:
      header: '&7[&eID&7] Администратор &8/ &7Причина &8/ &7Оставшееся время&f'
      body: '&7[&e%ID%&7] %OPERATOR% &8/ &7%REASON% &8/ &7%TIME_REMAINING%&f'
      footer: '&7Страница &e%PAGE%&7.||ttp:Нажмите, чтобы перейти на следующую
        страницу||cmd:/libertybans warns %TARGET% %NEXTPAGE_KEY%'

    usage: '&cИспользование: /warns &e<никнейм> [страница]'


misc:
  # Касается форматирования относительных значений времени и кулдаунов
  time:
    grammar:
      # Что должно стоять перед последним фрагментом? Оставьте пустым, чтобы отключить
      and: 'and '
      # Если включено, после каждого фрагмента времени (кроме последнего) ставится запятая
      comma: true
      # Время форматируется с точностью до секунд, но отображать секунды для большинства
      # промежутков времени обычно не нужно. Однако для очень маленьких значений
      # (менее минуты) секунды всё же нужно показывать.
      # Если в разделе выше используется SECONDS, это значение не имеет смысла.
    fallback-seconds: '%VALUE% секунд'
    fragments:
      YEARS: '%VALUE% лет'
      DAYS: '%VALUE% дней'
      MONTHS: '%VALUE% месяцев'
      HOURS: '%VALUE% часов'
      WEEKS: '%VALUE% недель'
      MINUTES: '%VALUE% минут'

  unknown-error: '&cПроизошла неизвестная ошибка.'
  # Применяется только если в основном конфиге стратегия синхронного применения (enforcement) установлена на DENY
  sync-chat-denial-message: '&cОтправка сообщения отклонена. &7Попробуйте ещё раз.'
  # Используется для /unban, /unmute, /unwarn
removals:
  mutes:
    success:
      message: '&7С игрока &c&o%VICTIM%&7 снят мут.'
      notification: '&c&o%UNOPERATOR%&7 снял мут с игрока &c&o%VICTIM%&7.'

    usage: '&cИспользование: /unmute &e<игрок>&c.'
    not-found: '&c&o%TARGET%&7 не в муте.'
    permission:
      ip-address: '&cНельзя снять мут с IP-адреса.'
      uuid: '&cНельзя снять мут с UUID.'
      both: '&cНельзя одновременно снять мут и с игрока, и с его IP-адреса.'

  warns:
    not-a-number: '&c&o%ID_ARG%&7 не является числом.'
    success:
      message: '&7С игрока &c&o%VICTIM%&7 снято предупреждение.'
      notification: '&c&o%UNOPERATOR%&7 снял предупреждение с игрока &c&o%VICTIM%&7.'

    usage: '&Использование: /unwarn &e<никнейм> <ID>&c.'
    not-found: '&c&o%TARGET%&7 не имеет предупреждения с ID &c&o%ID%&7.'
    permission:
      ip-address: '&cНельзя снять предупреждение с IP-адреса.'
      uuid: '&cНельзя снять предупреждение с UUID.'
      both: '&cНельзя одновременно снять предупреждение и с игрока, и с его
        IP-адреса.'

  bans:
    success:
      message: '&7С игрока &c&o%VICTIM%&7 снят бан.'
      notification: '&c&o%UNOPERATOR%&7 снял бан с игрока &c&o%VICTIM%&7.'

    usage: '&cИспользование: /unban &e<никнейм>&c.'
    not-found: '&c&o%TARGET%&7 не забанен.'
    permission:
      ip-address: '&cНельзя снять бан с IP-адреса.'
      uuid: '&cНельзя снять бан с UUID.'
      both: '&cНельзя одновременно снять бан и с игрока, и с его IP-адреса.'
  #
  # Сообщения для /ban, /mute, /warn, /kick
  # Включает оформление (layout) наказаний
  #
  #
additions:
  mutes:
    conflicting: '&c&o%TARGET%&7 уже находится в муте.'
    exempted: '&c&o%TARGET%&7 нельзя замутить.'
    success:
      message: '&aВыдан мут игроку &c&o%VICTIM%&a на &o%DURATION%&r&a по причине
        &e&o%REASON%&a.'
      notification: '&c&o%OPERATOR%&7 выдал мут игроку &c&o%VICTIM%&7 на
        &a&o%DURATION%&7 по причине &e&o%REASON%&7.%SILENCE%'

    layout:
      - '&7&lМут&f'
      - '&cОсталось: &e%TIME_REMAINING%&f'
      - ''
      - '&c&lПричина&f'
      - '&7%REASON%'
    usage: '&cИспользование: /mute &e<игрок> [время] <причина>&c.'
    permission:
      duration: '&cВы не можете выдать мут на &e%DURATION%&c.'
      ip-address: '&cНельзя применять это к IP-адресам.'
      uuid: '&cНельзя применять это к игрокам.'
      both: '&cНельзя применять это к игрокам и их IP-адресам.'

  kicks:
    must-be-online: '&c&o%TARGET%&7 должен быть онлайн.'
    exempted: '&c&o%TARGET%&7 нельзя кикнуть.'
    success:
      message: '&aИгрок &c&o%VICTIM%&a кикнут по причине &e&o%REASON%&a.'
      notification: '&c&o%OPERATOR%&7 кикнул игрока &c&o%VICTIM%&7 по причине
        &e&o%REASON%&7.'

    layout:
      - '&7&lКик&f'
      - ''
      - '&c&lПричина&f'
      - '&7%REASON%'
    usage: '&cИспользование: /kick &e<игрок> <причина>&c.'
    permission:
      ip-address: '&cНельзя применять это к IP-адресам.'
      uuid: '&cНельзя применять это к игрокам.'
      both: '&cНельзя применять это к игрокам и их IP-адресам.'

  warns:
    exempted: '&c&o%TARGET%&7 нельзя выдать предупреждение.'
    success:
      message: '&aВыдано предупреждение игроку &c&o%VICTIM%&a на &o%DURATION%&r&a по
        причине &e&o%REASON%&a.'
      notification: '&c&o%OPERATOR%&7 выдал предупреждение игроку &c&o%VICTIM%&7 на
        &a&o%DURATION%&7 по причине &e&o%REASON%&7.'

    layout:
      - '&7&lПредупреждение&f'
      - '&cОсталось: &e%TIME_REMAINING%&f'
      - ''
      - '&c&lПричина&f'
      - '&7%REASON%'
    usage: '&cИспользование: /warn &e<игрок> [время] <причина>&c.'
    permission:
