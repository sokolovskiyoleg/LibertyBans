admin:
  ellipses: '&a...'
  reloaded: '&aКонфигурация перезагружена'
  reload-failed: '&cПроизошла ошибка при перезагрузке конфигурации. Проверьте
    консоль сервера.'
  restarted: '&aПерезапущено'
  addons:
    reload-addon:
      does-not-exist: '&cТакого дополнения не существует.'
      success: '&aДополнение &e%ADDON%&a перезагружено.'
      failed: '&cПроизошла ошибка при перезагрузке конфигурации дополнения. Проверьте
        консоль сервера.'
      usage: '&cИспользование: /libertybans addon reload <дополнение>. Чтобы
        перезагрузить все дополнения сразу, используйте /libertybans reload.'

    listing:
      message: '&b&lУстановленные дополнения'
      layout: '&7- %ADDON%'

    usage: '&cИспользование: /libertybans addon <install|list|reload>'
    install:
      installed: '&aДополнение &e%ADDON%&a установлено. Оно загрузится после
        следующего перезапуска сервера.'
      does-not-exist: '&cНе удалось найти &e%ADDON%&c среди стандартных пакетов
        дополнений. &7Если вы хотите использовать внешнее или собственное
        дополнение, установите jar-файл напрямую в plugins/LibertyBans/addons.'
      already-installed: '&aДополнение &e%ADDON%&a уже установлено или находится в
        файловой системе.'
      usage: '&cИспользование: /libertybans addon install <дополнение>'

  no-permission: '&cИзвините, у вас нет доступа к этой команде.'
  importing:
    started: '&7Импорт начат. Подробности и прогресс смотрите в консоли сервера.'
    complete: '&7Импорт завершён.'
    usage: '&cИспользование: /libertybans import <advancedban|litebans|vanilla|self>'
    # Чтобы избежать ошибок, запускать несколько импортов одновременно запрещено.
    in-progress: '&cИмпорт уже выполняется.'
    failure: '&cИмпорт не удался. Подробности смотрите в консоли сервера.'
  # Specific formatting options
formatting:
  # Есть 2 способа выдать перманентное (бессрочное) наказание. Первый — не указывать время
  # (/ban <игрок> <причина>). Второй — указать значение времени, означающее "навсегда"
  # (/ban <игрок> perm <причина>).
  # Какие аргументы времени при вводе команды будут считаться перманентными?
  permanent-arguments:
    - 'perm'
    - 'permanent'
    - 'permanently'
    # Как отображать консоль?
  console-display: 'Console'
  # Как отображать типы наказаний?
  punishment-type-display:
    WARN: 'Предупреждение'
    KICK: 'Кик'
    MUTE: 'Мут'
    BAN: 'Бан'
    # Как отображать типы наказаний в виде глагола? Используется для переменной %TYPE_VERB%.
  punishment-type-verb-display:
    WARN: 'Выдано предупреждение'
    KICK: 'Кикнут'
    MUTE: 'Замучен'
    BAN: 'Забанен'
    # Как отображать "перманентность" в качестве длительности?
  permanent-display:
    # Как называть перманентную длительность?
    duration: 'Бесконечно'
    # Когда заканчивается перманентное наказание?
    absolute: 'Никогда'
    # Как описать оставшееся время у перманентного наказания?
    relative: 'Навсегда'
    # Как отображать глобальную область действия (все сервера)?
  global-scope-display: 'Все сервера'
  # Управляет отображением информации о нарушителях
  victim-display:
    # В редких случаях наказание может быть выдано игроку, чьё имя неизвестно. Это может произойти,
    # потому что наказания выдаются по UUID, но при некоторых настройках получить имя игрока по UUID
    # невозможно. В этом случае вместо имени игрока используется следующий текст.
    player-name-unknown: '-ИмяНеизвестно-'
    # Скрывать ли IP-адреса для игроков без права libertybans.admin.viewips
    censor-ip-addresses: false
    # Текст-заменитель, который отображается, когда IP-адрес нельзя показать из-за отсутствия прав
    censored-ip-address: '<IP-адрес скрыт>'
    # При использовании /blame, как обозначать консоль?
  console-arguments:
    - 'console'
    # Большинству пользователей эта секция не понадобится. Она в основном для "красоты".
    # Если хотите изменить, как отображаются и обрабатываются ID, настройте это здесь.
  id-display:
    # Какая система счисления должна использоваться? Например:
    # 2 - двоичная, 10 - обычная (десятичная), 16 - шестнадцатеричная.
    # Максимальное значение - 36, будут использоваться все буквы алфавита плюс 10 цифр (26 + 10 = 36).
    base: 10
      # Некоторые пользователи хотят, чтобы их ID отображались "случайным" образом (или хотя бы псевдослучайным).
      # Измените эту настройку, чтобы включить псевдослучайное перемешивание ID. Доступные значения:
      # - NONE : без изменений (по умолчанию)
      # - BITFIDDLE : псевдослучайный подход, который просто переставляет биты местами (рекомендуется использовать с базой 36)
      # - CIPHER : использует блочное шифрование. Выглядит очень случайным
      #
      # Все эти алгоритмы обратимы. Это значит, что независимо от настроек, эти ID можно
      # прозрачно использовать во всём плагине. Например, /unwarn <игрок> <ID> будет работать,
      # но только если вы введёте перемешанный (scrambled) ID.
      #
    # Обратите внимание: если вы используете несколько экземпляров плагина одновременно, эта настройка
    # и 'number-of-algorithm-runs' должны совпадать на всех экземплярах. Если не совпадут - плагин
    # всё равно будет работать, но использование ID превратится в сущий кошмар.
    scrambling-algorithm: 'NONE'
    # Сколько раз применять алгоритм из 'scrambling-algorithm'.
    number-of-algorithm-runs: 2
    # Если используется база больше 10, эта настройка определяет, будут ли буквы заглавными.
    capitalize-letters-in-display: false
    # Когда у наказания больше не осталось времени (наказание истекло),
    # именно это значение подставляется в переменную %TIME_REMAINING%
  no-time-remaining-display: 'Н/Д'
  # Как отображать переменную %HAS_EXPIRED%?
  punishment-expired-display:
    # Как описать истёкшее наказание?
    expired: '&cИстекло'
    # Как описать наказание, которое ещё не истекло?
    not-expired: '&7Не истекло'
    # Управляет отображением переменных %TRACK%, %TRACK_ID% и %TRACK_NAMESPACE%
  track-display:
    # Как описать отсутствие трека эскалации (последовательности наказаний)?
    # Это значение будет отображаться в переменной %TRACK%
    no-track: 'Нет трека'
    # Как описать отсутствие трека эскалации применительно к его ID?
    # Это значение будет отображаться в переменной %TRACK_ID%
    no-track-id: 'Нет ID трека'
    # Как описать отсутствие трека эскалации применительно к его пространству имён (namespace)?
    # Это значение будет отображаться в переменной %TRACK_NAMESPACE%
    no-track-namespace: '(нет)'
      # При желании вы можете переопределить отображаемые названия треков. Обычно отображается ID трека,
      # который хранится в базе данных в нижнем регистре. Если вы хотите, чтобы для трека отображалось
    # другое (более понятное) название, укажите его здесь.
    #
    # Эта настройка влияет на переменную %TRACK%, но не влияет на %TRACK_ID%.
    track-display-names:
      spam: 'Спам'
      hacking: 'Читерство'
    # Управляет переменной %SILENCE%, когда она доступна.
    # Посмотрите на сообщение о муте (mute) для примера использования этой переменной.
  silence:
    not-silent: []
    silent: '&7 [&f&oТихо&7]'
